# Tempo in single-binary mode with local block storage. Traces arrive from the OTel collector
# over OTLP gRPC; Grafana queries the HTTP API on 3200. All data lives under /var/tempo.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
