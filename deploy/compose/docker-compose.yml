# Local stack: infrastructure every VMS service depends on.
#
# Start with `make up` (waits until every health check passes), stop with `make down`.
# Variables come from the repo-root .env (the Makefile passes --env-file); every one has a
# default here so the stack also starts without it. Host ports bind to 127.0.0.1 only and are
# overridable with *_PORT variables when a default port is taken on the host.
#
# Profiles: infrastructure below has no profile and always starts. Application services that
# exist in a CPU and a GPU variant (the inference worker; Phase 1+) carry
# `profiles: [cpu]` or `profiles: [gpu]`. `make up` activates `cpu`; `make up PROFILES=gpu`
# activates `gpu`.
#
# Images are pinned by tag; bump deliberately and re-run `make test-integration`.

name: vms

x-healthcheck-defaults: &healthcheck-defaults
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

# Tempo and the OTel collector ship distroless images with no shell or HTTP client for health
# checks; their inline builds add a static busybox as /bin/wget and nothing else.

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vms}
      POSTGRES_USER: ${POSTGRES_USER:-vms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      <<: *healthcheck-defaults
      # Over TCP, because the temporary server used during first-time init listens only on the
      # Unix socket, so a socket check can pass before the real server is up.
      test:
        - CMD-SHELL
        - psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc 'SELECT 1' >/dev/null
    restart: unless-stopped

  # S3-compatible object store (SeaweedFS in single-process "mini" mode; see D12 for why not
  # MinIO). `-bucket` creates the buckets at startup, so no separate bootstrap job is needed.
  objectstore:
    image: chrislusf/seaweedfs:4.48
    command:
      - mini
      - -dir=/data
      - -bucket=${S3_BUCKET:-vms-frames}
      - -master.telemetry=false
      - -webdav=false
    environment:
      # Becomes the S3 admin identity.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-vms-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me-s3}
      S3_BUCKET: ${S3_BUCKET:-vms-frames}
    volumes:
      - objectstore-data:/data
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    healthcheck:
      <<: *healthcheck-defaults
      # Healthy once the S3 gateway answers and the bucket exists (filer lists /buckets).
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://localhost:8333/healthz &&
          wget -q -O - --header 'Accept: application/json' http://localhost:8888/buckets/ |
          grep -q "/buckets/$$S3_BUCKET\""
    restart: unless-stopped

  otel-collector:
    build:
      dockerfile_inline: |
        FROM otel/opentelemetry-collector-contrib:0.162.0
        COPY --from=busybox:1.37.0-musl /bin/busybox /bin/wget
    image: vms/otel-collector:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
    depends_on:
      tempo:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "/bin/wget", "-q", "-O", "/dev/null", "http://localhost:13133/"]
    restart: unless-stopped

  tempo:
    build:
      dockerfile_inline: |
        FROM grafana/tempo:3.1.0
        COPY --from=busybox:1.37.0-musl /bin/busybox /bin/wget
    image: vms/tempo:3.1.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "/bin/wget", "-q", "-O", "/dev/null", "http://localhost:3200/ready"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      # Lets Tempo's metrics generator (and later k6) push samples.
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.10
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      # Local convenience: dashboards are readable without logging in. Editing needs admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
    restart: unless-stopped

volumes:
  postgres-data:
  objectstore-data:
  tempo-data:
  prometheus-data:
  grafana-data:
