# Local stack: infrastructure every VMS service depends on.
#
# Start with `make up` (waits until every health check passes), stop with `make down`.
# Variables come from the repo-root .env (the Makefile passes --env-file); every one has a
# default here so the stack also starts without it. Host ports bind to 127.0.0.1 only and are
# overridable with *_PORT variables when a default port is taken on the host.
#
# Profiles: infrastructure below has no profile and always starts. Application services that
# exist in a CPU and a GPU variant (the inference worker; Phase 1+) carry
# `profiles: [cpu]` or `profiles: [gpu]`. `make up` activates `cpu`; `make up PROFILES=gpu`
# activates `gpu`. The containerized application (profile `app`: the query service with the UI)
# starts with `make app`, after `make up` has migrated the database.
#
# Images are pinned by tag; bump deliberately and re-run `make test-integration`.

name: vms

x-healthcheck-defaults: &healthcheck-defaults
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

# Tempo and the OTel collector ship distroless images with no shell or HTTP client for health
# checks; their inline builds add a static busybox as /bin/wget and nothing else.

# Connection settings shared by the application containers: the same POSTGRES_* and S3_*
# values as the host, pointed at the services on the compose network.
x-app-env: &app-env
  VMS_ENV: ${VMS_ENV:-local}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-vms}
  POSTGRES_USER: ${POSTGRES_USER:-vms}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
  POSTGRES_READONLY_USER: ${POSTGRES_READONLY_USER:-vms_query}
  POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:-change-me}
  S3_ENDPOINT_URL: http://objectstore:8333
  S3_BUCKET: ${S3_BUCKET:-vms-frames}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-vms-local}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me-s3}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vms}
      POSTGRES_USER: ${POSTGRES_USER:-vms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      <<: *healthcheck-defaults
      # Over TCP, because the temporary server used during first-time init listens only on the
      # Unix socket, so a socket check can pass before the real server is up.
      test:
        - CMD-SHELL
        - psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc 'SELECT 1' >/dev/null
    restart: unless-stopped

  # S3-compatible object store (SeaweedFS in single-process "mini" mode; see D12 for why not
  # MinIO). `-bucket` creates the buckets at startup, so no separate bootstrap job is needed.
  objectstore:
    image: chrislusf/seaweedfs:4.48
    command:
      - mini
      - -dir=/data
      - -bucket=${S3_BUCKET:-vms-frames}
      - -master.telemetry=false
      - -webdav=false
    environment:
      # Becomes the S3 admin identity.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-vms-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me-s3}
      S3_BUCKET: ${S3_BUCKET:-vms-frames}
    volumes:
      - objectstore-data:/data
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    healthcheck:
      <<: *healthcheck-defaults
      # Healthy once the S3 gateway answers and the bucket exists (filer lists /buckets).
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://localhost:8333/healthz &&
          wget -q -O - --header 'Accept: application/json' http://localhost:8888/buckets/ |
          grep -q "/buckets/$$S3_BUCKET\""
    restart: unless-stopped

  otel-collector:
    build:
      dockerfile_inline: |
        FROM otel/opentelemetry-collector-contrib:0.162.0
        COPY --from=busybox:1.37.0-musl /bin/busybox /bin/wget
    image: vms/otel-collector:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
    depends_on:
      tempo:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "/bin/wget", "-q", "-O", "/dev/null", "http://localhost:13133/"]
    restart: unless-stopped

  tempo:
    build:
      dockerfile_inline: |
        FROM grafana/tempo:3.1.0
        COPY --from=busybox:1.37.0-musl /bin/busybox /bin/wget
    image: vms/tempo:3.1.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "/bin/wget", "-q", "-O", "/dev/null", "http://localhost:3200/ready"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      # Lets Tempo's metrics generator (and later k6) push samples.
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.10
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      # Local convenience: dashboards are readable without logging in. Editing needs admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Opens on the pipeline dashboard (dashboards as code, task 2.2).
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/pipeline.json
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
    restart: unless-stopped

  # --- Application (profile app) -----------------------------------------------------------
  # One image for the Python services (deploy/docker/Dockerfile), built from the repo root.
  # `make app` starts the query service + UI; `make demo` also starts ingest and a worker.
  ingest:
    profiles: [app]
    image: vms/app:local
    pull_policy: never  # built locally by the query service's build (make app / make demo build first)
    command: ["python", "-m", "vms.ingest"]
    environment:
      <<: *app-env
      VMS_HTTP__HOST: 0.0.0.0
      VMS_HTTP__PORT: "8080"
    ports:
      - "127.0.0.1:${INGEST_PORT:-8080}:8080"
    depends_on:
      query:          # same image: built once, by the query service's build section
        condition: service_started
      postgres:
        condition: service_healthy
      objectstore:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"
    restart: unless-stopped

  worker:
    profiles: [app]
    image: vms/app:local
    pull_policy: never  # built locally by the query service's build (make app / make demo build first)
    command: ["python", "-m", "vms.worker", "run"]
    environment:
      <<: *app-env
      VMS_HTTP__HOST: 0.0.0.0
      VMS_HTTP__PORT: "8090"
      # yolo11n keeps up with more cameras on CPU than yolo11s (E-013, E-014).
      VMS_DETECTOR__WEIGHTS: ${DEMO_WEIGHTS:-yolo11n}
      # Backend and frames per forward pass (D5, task 5.5); onnxruntime needs `make onnx`.
      VMS_DETECTOR__BACKEND: ${WORKER_BACKEND:-ultralytics}
      VMS_QUEUE__INFER_BATCH: ${WORKER_INFER_BATCH:-1}
      VMS_DETECTOR__SPIN: ${WORKER_SPIN:-true}
    volumes:
      # Fetched, verified and exported on the host (make models, make onnx); read-only here.
      - ../../models/weights:/app/models/weights:ro
      - ../../models/onnx:/app/models/onnx:ro
    ports:
      - "127.0.0.1:${WORKER_PORT:-8090}:8090"
    depends_on:
      query:
        condition: service_started
      postgres:
        condition: service_healthy
      objectstore:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      start_period: 60s   # loads and warms the model first
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/readyz', timeout=2)"
    restart: unless-stopped

  query:
    profiles: [app]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      secrets: [extra_ca]
    image: vms/app:local
    command: ["python", "-m", "vms.query", "serve"]
    environment:
      <<: *app-env
      VMS_HTTP__HOST: 0.0.0.0
      VMS_HTTP__PORT: "8070"
      # The planner. Empty LLM_MODEL: the canned planner. Ollama on the host is reachable at
      # http://host.docker.internal:11434/v1 (on Linux, Ollama must listen beyond 127.0.0.1).
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      VMS_LLM__PROVIDER: ${VMS_LLM__PROVIDER:-auto}
      VMS_LLM__RESPONSE_FORMAT: ${VMS_LLM__RESPONSE_FORMAT:-json_schema}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${QUERY_PORT:-8070}:8070"
    depends_on:
      postgres:
        condition: service_healthy
      objectstore:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8070/readyz', timeout=2)"
    restart: unless-stopped

# Optional CA for builds behind a TLS-intercepting proxy (EXTRA_CA_CERT in .env). The default
# is an empty file inside the repo: BuildKit's bake (used by `compose build`) refuses secret files
# outside the project without an extra grant, so /dev/null does not work there (E-023).
secrets:
  extra_ca:
    file: ${EXTRA_CA_CERT:-../docker/no-extra-ca.pem}

volumes:
  postgres-data:
  objectstore-data:
  tempo-data:
  prometheus-data:
  grafana-data:
