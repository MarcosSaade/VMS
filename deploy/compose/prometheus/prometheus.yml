# Scrape targets for the local stack. Each VMS service exposes /metrics with names of the form
# vms_<component>_<metric>_<unit>.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules (task 9.3); no Alertmanager in the local stack: alerts show under Status > Alerts
# (http://localhost:9090/alerts) and in Grafana.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # OTLP metrics received by the collector, re-exposed in Prometheus format.
  - job_name: otel-collector-otlp
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  # VMS application containers (profile app). Found through Docker's DNS: a service that is not
  # running has no targets (instead of a target that is down), and `--scale worker=N` gives one
  # target per replica. Every 5 s, so short benchmark steps still get enough samples.
  # Services run on the host (make ingest / make worker) are not scraped; see RUNBOOK.
  - job_name: ingest
    scrape_interval: 5s
    dns_sd_configs:
      - names: [ingest]
        type: A
        port: 8080
        refresh_interval: 5s

  - job_name: worker
    scrape_interval: 5s
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 8090
        refresh_interval: 5s

  - job_name: drift
    scrape_interval: 5s
    dns_sd_configs:
      - names: [drift]
        type: A
        port: 8095
        refresh_interval: 5s

  - job_name: query
    scrape_interval: 5s
    dns_sd_configs:
      - names: [query]
        type: A
        port: 8070
        refresh_interval: 5s

  # NVIDIA DCGM exporter: only on the GPU instance (deploy/compose/docker-compose.gpu.yml).
  # Elsewhere the name does not resolve and the job has no targets.
  - job_name: dcgm
    scrape_interval: 5s
    dns_sd_configs:
      - names: [dcgm-exporter]
        type: A
        port: 9400
        refresh_interval: 5s
