# Dashboards as code (task 2.2). The JSON in deploy/grafana/dashboards/ is generated by
# `make dashboards` (vms.observe.dashboards); edit the Python, not the JSON.
apiVersion: 1

providers:
  - name: vms
    folder: VMS
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 10   # picks up regenerated files without a restart
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
