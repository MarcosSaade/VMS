# Alembic (database migrations). The connection comes from POSTGRES_* (vms.storage.config), not
# from this file. Usage: `make migrate` (upgrade head), `uv run alembic downgrade -1`,
# `uv run alembic revision -m "..."` for a new migration (then write it by hand in SQL).
[alembic]
script_location = %(here)s/src/vms/storage/migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
