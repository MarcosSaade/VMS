[project]
name = "vms"
version = "0.1.0"
description = "Scalable Video Management System: benchmarked ML systems engineering."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "alembic>=1.20.0",
    "boto3>=1.43.110",
    "fastapi>=0.143.0",
    "opencv-python-headless>=5.0.0.93",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "prometheus-client>=0.26.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlglot>=30.21.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "ultralytics>=8.4.175",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "dvc>=3.60",
    "httpx2>=2.13.1",
    "mypy>=1.18",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "ruff>=0.13",
    "types-boto3[s3]>=1.43.110",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]
# ultralytics requires opencv-python, which installs the same `cv2` module as the headless build
# we use (no GUI libraries, smaller); two copies overwrite each other. Drop the GUI build.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

# CPU-only PyTorch wheels by default (~10x smaller than the CUDA build PyPI serves on Linux), so
# a fresh clone works on a laptop. GPU sessions install the CUDA build (task 2.4).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "PT",  # pytest style
    "RUF", # ruff-specific
    "T20", # no print in library code
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
files = ["src/vms"]
mypy_path = "src"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Non-unit tests are opt-in: `make test-integration` passes `-m integration`, which
# overrides this default expression because the last `-m` on the command line wins.
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not integration and not gpu and not slow"]
markers = [
    "integration: needs the compose CPU stack (make up); run with make test-integration",
    "gpu: needs a CUDA GPU; skipped by default",
    "slow: long-running; skipped by default",
]
xfail_strict = true
