# Lint, typecheck and unit tests on every push and pull request.
# Actions are pinned by commit SHA (tags are mutable); the comment shows the tag.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.20"   # keep in step with the uv used to write uv.lock
  WANDB_MODE: disabled

jobs:
  check:
    name: make check (lint, typecheck, unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv with dependency and Python caching
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true

      - name: make setup
        run: make setup   # uv sync --locked: fails if uv.lock is out of date with pyproject.toml

      - name: make check
        run: make check

  integration:
    # Placeholder: runs against the compose CPU stack once it exists (task 0.5).
    # Then: make up -> wait for /readyz -> make test-integration -> make logs on failure -> make down.
    name: integration (placeholder)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true

      - run: make setup

      - name: make test-integration
        run: make test-integration
