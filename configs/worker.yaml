# Inference worker (vms.worker). Overrides configs/common.yaml; VMS_* environment variables
# override this file (e.g. VMS_DETECTOR__DEVICE=cuda). Database and object-store connection
# settings come from POSTGRES_* and S3_* in .env.

http:                          # /healthz, /readyz, /metrics
  host: 127.0.0.1
  port: 8090

queue:                         # Postgres as the queue (D3), camera leases (D20)
  max_cameras: 16
  lease_ttl_s: 30
  renew_every_s: 5
  claim_batch: 4
  max_attempts: 3
  poll_min_s: 0.05
  poll_max_s: 1.0
  backlog_every_s: 5
  shutdown_grace_s: 10

detector:                      # in-process, batch size 1 (Phase 1 baseline)
  weights: yolo11s             # configs/models.yaml
  backend: ultralytics         # ultralytics (PyTorch) | onnxruntime (needs make onnx); D5
  device: cpu                  # cpu | cuda
  imgsz: 640
  conf: 0.1                    # low on purpose: ByteTrack's second round uses unsure boxes;
                               # tracker.store_min_conf decides what is stored
  iou: 0.7
  max_det: 300
  threads: null                # intra-op threads; null: backend default (one per physical core)

tracker:                       # ByteTrack per camera (vms.worker.tracking)
  fps: 5.0                     # cameras' analysis rate; turns buffer_s into frames
  high_thresh: 0.25
  low_thresh: 0.1
  new_track_thresh: 0.25
  match_thresh: 0.8
  fuse_score: true
  buffer_s: 2.0                # a lost track is kept (and keeps its zone state) this long
  classes: [person, bicycle, car, motorcycle, bus, truck]
  store_min_conf: 0.25         # weaker detections are stored only when part of a track

zones:                         # enter / exit / loiter (vms.worker.zones)
  min_frames: 2                # consecutive frames on the new side to confirm a crossing
  loiter_s: 30
  refresh_s: 60

db:
  min_size: 1
  max_size: 4
  connect_timeout_s: 5
  acquire_timeout_s: 2
  statement_timeout_ms: 5000

objects:
  max_concurrency: 4
  connect_timeout_s: 2
  read_timeout_s: 5
  max_attempts: 3

telemetry:
  sample_ratio: 0.01
