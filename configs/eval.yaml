# Evaluation tooling (python -m vms.eval). Overrides configs/common.yaml; VMS_* environment
# variables override this file (e.g. VMS_DB=vms_eval_2). Postgres credentials come from
# POSTGRES_* and POSTGRES_READONLY_* in .env, as for the services.

db: vms_eval                  # the eval snapshot's own database on the stack's Postgres
statement_timeout_ms: 10000   # per gold query, as the read-only login

snapshot:                     # frozen synthetic database (D29); paths from the repo root
  spec: configs/eval/snapshot.v1.yaml
  dir: eval/structured/snapshot.v1          # DVC-tracked
  manifest: eval/structured/snapshot.v1.json  # in git: seed, eval clock, file hashes

structured:
  items: eval/structured/items.v1.jsonl     # authored questions with gold plan and SQL
  dev: eval/structured/dev.v1.jsonl         # built: items + expected rows, dev split
  test: eval/structured/test.v1.jsonl       # built: frozen test split (hash in BENCHMARKS.md)
  manifest: eval/structured/dataset.v1.json
  splits: eval/structured/splits.v1.json    # frozen assignment: items never change sides
  split_seed: 31
  test_fraction: 0.5

# Near-duplicate thresholds for leakage checks against the few-shot bank and between groups.
leakage:
  min_ratio: 0.85             # difflib similarity of normalized questions
  min_jaccard: 0.8            # word-set overlap

# Result comparison (vms.eval.compare): numbers equal within these tolerances.
compare:
  rel_tol: 1.0e-6
  abs_tol: 1.0e-6

# Eval runs (make eval, python -m vms.eval run; task 3.2).
run:
  concurrency: 4              # questions in flight; red-team questions always run one at a time
  resamples: 2000             # bootstrap resamples per metric
  confidence: 0.95
  seed: 2026                  # bootstrap seed, recorded in each results file
  results_dir: eval/results

# USD per million tokens, by LLM_MODEL. A model not listed gets no cost in its results.
# Fill in from the provider's price page on the day of the run; note the date in EXPERIMENTS.md.
# DeepSeek (prices given by the user on 2026-10-14): peak-hour, cache-miss input rates, so
# reported costs are upper bounds (off-peak halves them; cached prompt tokens cost ~1% as much,
# and the planner prompt is mostly a cacheable prefix). Usage does not report cache hits yet.
# Cache-hit rate (2026-10-23, task 8.2): $0.006/M at peak hours, from a third-party price list
# (activepieces.com, 2026-10-21; DeepSeek's own page was not checked), used only where usage
# reports cache hits (vms.traindata); the eval's own costs still price every token as a miss.
prices:
  deepseek-flash: {prompt_per_mtok: 0.30, completion_per_mtok: 1.20, prompt_cache_hit_per_mtok: 0.006}
  deepseek-v4-pro: {prompt_per_mtok: 1.32, completion_per_mtok: 3.96}
