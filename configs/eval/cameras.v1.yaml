# Camera catalog of the structured-query eval snapshot (task 3.1). Same format as
# configs/cameras.yaml (vms.storage.catalog); synced into the eval database by
# `python -m vms.eval load`, never into the dev database.
#
# The four demo cameras keep their names, ids and zones, so questions read like the few-shot bank.
# The fifth camera, lobby, is in New York: questions over "today" or "this morning" across all
# cameras then resolve to different UTC bounds per camera, as the compiler promises.
# Frozen with snapshot v1: changing anything here changes gold answers (make a v2 instead).

version: 1

cameras:
  - camera_id: cam-001
    name: entrance
    site: demo-store
    timezone: Europe/London
    zones:
      - name: front_door
        polygon: [[0.0356, 0.7465], [0.3169, 0.6667], [0.6907, 0.8716], [0.4288, 1.0]]

  - camera_id: cam-002
    name: checkout
    site: demo-store
    timezone: Europe/London
    zones:
      - name: register_1
        polygon: [[0.1746, 0.0686], [0.3729, 0.0731], [0.4178, 1.0], [0.05, 0.9966]]
      - name: register_2
        polygon: [[0.6136, 0.0098], [0.8025, 0.0053], [1.0, 0.5552], [0.7602, 0.5733]]

  - camera_id: cam-003
    name: parking_lot
    site: demo-store
    timezone: Europe/London

  - camera_id: cam-004
    name: loading_dock
    site: demo-store
    timezone: Europe/London

  - camera_id: cam-005
    name: lobby
    site: demo-office
    timezone: America/New_York
    zones:
      - name: elevators
        polygon: [[0.55, 0.2], [0.95, 0.2], [0.95, 0.7], [0.55, 0.7]]
