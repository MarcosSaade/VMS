# Public video sources for virtual cameras (task 1.1). Read by `python -m vms.datasets`
# (make data, make data-mini); see docs/RUNBOOK.md, Data, for licenses and how to add a clip.
#
# Every source is pinned: zip sequences by archive size plus a sha256 over the selected frames
# (compute with `python -m vms.datasets pin <clip_id>`), video files by the checksum their host
# publishes. Scene labels were checked by looking at frames, except where a clip says otherwise.
# Only static cameras are used. Bump `version` when clips change.

version: 1

processing:
  max_height: 720      # the workload's 720p frames (ARCHITECTURE 2); downscale only
  max_fps: 30
  jpeg_quality: 90

licenses:
  cc-by-nc-sa-3.0:
    name: Creative Commons Attribution-NonCommercial-ShareAlike 3.0
    url: https://creativecommons.org/licenses/by-nc-sa/3.0/
    commercial_use: false
    share_alike: true
    notes: MOTChallenge data. Cite the benchmark papers; no commercial use.
  cc-by-sa-4.0:
    name: Creative Commons Attribution-ShareAlike 4.0
    url: https://creativecommons.org/licenses/by-sa/4.0/
    commercial_use: true
    share_alike: true
    notes: Wikimedia Commons uploads by their authors. Attribute the author and link the file page.
  virat:
    name: VIRAT Video Data Set Protection Agreement
    url: https://actev.kitware.com/pub/VIRAT-Video-Data-Set-Protection-Agreement-1-4-11.pdf
    commercial_use: true
    share_alike: false
    requires_acceptance: true
    notes: >-
      Every person using the data must sign the agreement. No redistribution to anyone who has
      not; protect personally identifiable information and never try to identify people. A few
      frames or short clips may be shown in publications and talks.

