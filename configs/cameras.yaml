# Camera catalog: cameras and zones, synced into Postgres by `python -m vms.storage bootstrap`
# (make migrate). Upsert only: rows removed here stay in the database (see vms.storage.catalog).
#
# - camera_id: what the camera sends frames as. The ids match loadgen's naming with 4 cameras
#   (cam-001..cam-004, configs/loadgen.yaml camera_prefix), used by the demo (task 1.9).
# - name: what questions and QueryPlan filters use; matches the few-shot bank
#   (eval/fewshot/structured.v1.jsonl). Zone names are unique across the catalog.
# - timezone: IANA name; "today" and "this morning" are computed in it.
# - polygon: [x, y] points normalized to the frame (0..1, origin top-left), simple, non-zero
#   area; edges count as inside. Draw and edit them on frames of each camera's demo clip with
#   the zone editor (make zones), which rewrites this file below this comment block; then
#   make migrate. Until drawn, the positions are placeholders that do produce enters and exits on
#   the demo clips (E-015). Check them with python -m vms.worker render CLIP:CAMERA --out x.mp4.

version: 1

cameras:
  - camera_id: cam-001
    name: entrance
    site: demo-store
    timezone: Europe/London
    zones:
      - name: front_door
        polygon: [[0.0356, 0.7465], [0.3169, 0.6667], [0.6907, 0.8716], [0.4288, 1.0]]

  - camera_id: cam-002
    name: checkout
    site: demo-store
    timezone: Europe/London
    zones:
      - name: register_1
        polygon: [[0.1746, 0.0686], [0.3729, 0.0731], [0.4178, 1.0], [0.05, 0.9966]]
      - name: register_2
        polygon: [[0.6136, 0.0098], [0.8025, 0.0053], [1.0, 0.5552], [0.7602, 0.5733]]

  - camera_id: cam-003
    name: parking_lot
    site: demo-store
    timezone: Europe/London

  - camera_id: cam-004
    name: loading_dock
    site: demo-store
    timezone: Europe/London
