# Drift monitor (vms.drift, task 9.1). Overrides configs/common.yaml; VMS_* environment
# variables override this file (e.g. VMS_MONITOR__REFERENCE_S=300). Database connection
# settings come from POSTGRES_* in .env.

http:                          # /healthz, /readyz, /metrics
  host: 127.0.0.1
  port: 8095

monitor:                       # windows in capture time (vms.drift.monitor)
  window_s: 30                 # current window: 150 frames per camera at 5 FPS
  reference_s: 60              # calibration period of a camera seen for the first time;
                               # short so the 3-minute demo gets statistics
  update_every_s: 5
  settle_s: 3                  # window ends this long before now (frames still in the queue)
  discover_every_s: 30
  shutdown_grace_s: 5
  detect_min_coverage: 0.9     # detector skips windows whose frames span less (start, resume, stop)

signals:                       # vms.drift.signals
  min_conf: 0.25               # = tracker.store_min_conf (configs/worker.yaml)
  classes: [person, bicycle, car, motorcycle, bus, truck]   # class-mix bins, plus "other"
  min_frames: 20
  min_detections: 20
  psi_eps: 0.0001
  min_std:                     # floor of the reference std, in each signal's units
    brightness: 1.0
    contrast: 1.0
    log_blur: 0.05
    noise: 0.1
    detections_per_frame: 0.5
    confidence: 0.01

# Alerting (task 9.3, D34). Fixed threshold on each channel's z = (statistic - mean) / std,
# both from the clean streams of bench/results/2026-10-16-drift-detect-cpu-01M52J2GYHBMPAMRVCQW19GZPA.json
# (calibration_all; laptop, MOT17 clips that loop every 17-35 s). The leave-one-repetition-out
# rule picked h=3 in every fold; h=10 is deployed for margin: clean data from looping clips
# understates clean variation, and h=2 already gave 489 false alarms. h=10 still caught all
# 36 drifted streams (median delay 5.6 s vs 4.8 s). Remove `calibration` to turn alarms off.
detector:
  kind: threshold              # threshold | cusum (vms.drift.detect)
  h: 10
calibration:                   # `make drift-score`; recalibrate on each site's clean video
  channels:
    shift:brightness: {mean: 0.0192, std: 0.1338}
    shift:contrast: {mean: 0.0054, std: 0.1343}
    shift:log_blur: {mean: -0.0091, std: 0.1042}
    shift:noise: {mean: -0.0022, std: 0.1}
    shift:detections_per_frame: {mean: -0.0509, std: 0.1337}
    shift:confidence: {mean: 0.0087, std: 0.1}
    confidence_ks: {mean: 0.0198, std: 0.00969}
    confidence_wasserstein: {mean: 0.00495, std: 0.00232}
    class_psi: {mean: 0.0016, std: 0.002}

db:
  min_size: 1
  max_size: 2
  connect_timeout_s: 5
  acquire_timeout_s: 2
  statement_timeout_ms: 5000
