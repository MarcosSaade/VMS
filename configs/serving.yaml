# LLM serving benchmarks (task 8.1, D40; python -m vms.bench run on a `kind: llm` scenario).
# Overrides configs/common.yaml; VMS_* environment variables override this file. The engines
# are installed on the pod by scripts/pod_remote.sh (setup llm) at the versions pinned there.

vllm:
  bin: /root/vllm-env/bin/vllm  # its own virtualenv: vLLM pins its own torch
  host: 127.0.0.1
  port: 8000
  env:
    # FlashInfer JIT-compiles its top-k/top-p sampler at warmup and needs nvcc, which the pod
    # image does not have (the first session's engines all failed to start this way, E-066).
    # vLLM then uses its PyTorch sampler; decoding here is greedy anyway.
    VLLM_USE_FLASHINFER_SAMPLER: "0"
ollama:
  bin: /usr/local/bin/ollama
  host: 127.0.0.1
  port: 11434
  pull_timeout_s: 1800
lora:                           # LoRA training (task 8.3, D42) and merging (8.4) on the pod
  python: /root/vllm-env/bin/python  # vLLM's environment (CUDA torch, transformers) + peft
  script: scripts/lora_train.py
  merge_script: scripts/lora_merge.py
  unpack_dir: data/serving/lora # adapter .tar files unpacked for vLLM
  merged_dir: data/serving/merged  # base + adapter merged (8.4); ~9 GB each, not collected
  merge_timeout_s: 1800
  work_dir: data/lora           # rendered training examples and run specs
  planner:                      # chosen on dev (E-073), reported on test; served only at this hash
    name: all-r4
    path: models/lora/lora-plan-a40-b-all-r4.tar
    sha256: 21412c6e55779d99affa44006a749676bbdb6a2648ef0dc8214fc90b9d35213c
    base_model: Qwen/Qwen3.5-4B
    base_revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
    prompt: configs/prompts/planner.compact.v1.txt
# The planner when self-hosted (task 8.4, D43; D7 keeps the hosted model as the default): the
# GPTQ W4A16 base with lora.planner on top, prefix caching on. On one A40 it is the fastest
# option measured (13.1 req/s at 32 concurrent, p95 1.18 s at 1) and the only one inside the
# 1.5 s query SLO at concurrency 1, at -0.7 [-3.5, +1.4] test points against the BF16 adapter
# (E-075, E-076). Served with the same flags as bench/scenarios/llm-quant-test-a40.yaml.
planner_server:
  model: RedHatAI/Qwen3.5-4B-quantized.w4a16
  revision: 7a613872f394578b0b52b683ff4ac47516b4bcaf
  args: [--max-model-len, "16384", --gpu-memory-utilization, "0.90", --language-model-only,
         --generation-config, vllm, --enable-prefix-caching]
  request_extra: {chat_template_kwargs: {enable_thinking: false}}
poll_s: 2.0                     # health checks while a server starts
stop_timeout_s: 60              # SIGTERM, then SIGKILL
request_timeout_s: 120          # health, version and metrics reads
log_tail_lines: 40              # of a server's log, into the results on a failed start
