# Query service. Overrides configs/common.yaml; VMS_* environment variables override this file
# (e.g. VMS_SQL__MAX_LIMIT=500). Database and object-store connections come from POSTGRES_*,
# POSTGRES_READONLY_* and S3_* in .env; the LLM from LLM_* (see .env.example).

http:
  host: 127.0.0.1
  port: 8070
  graceful_shutdown_s: 10

reader:                       # read-only login that runs compiled SQL (ARCHITECTURE 11)
  min_size: 1
  max_size: 8
  connect_timeout_s: 5
  acquire_timeout_s: 2
  statement_timeout_ms: 5000  # cancels runaway queries; the error type is "timeout"

log_db:                       # schema owner, INSERT into query_log only
  min_size: 0
  max_size: 2
  connect_timeout_s: 5
  acquire_timeout_s: 2
  statement_timeout_ms: 2000

objects:                      # frame images for GET /v1/frames/{id}/image
  max_concurrency: 4
  connect_timeout_s: 2
  read_timeout_s: 5
  max_attempts: 3

catalog_ttl_s: 30             # cameras and zones are re-read from Postgres at most this often
ui_dir: frontend/dist         # built UI (make ui-build), served at / when present

telemetry:
  sample_ratio: 1.0           # every question is traced

sql:
  dialect: postgres
  default_limit: 100        # injected when the outer query has no LIMIT
  max_limit: 1000           # larger LIMITs are capped to this
  max_joins: 4
  max_sql_chars: 20000

  # Queryable schema (ARCHITECTURE 4.6): table -> column -> type. This is the validator's
  # allowlist and the source of the schema summary in prompts. Postgres enforces the same list:
  # migration 0003 grants the query reader SELECT on exactly these columns (D19), and tests fail
  # if the two, or the migrated column types, disagree. query_log is left out on purpose.
  tables:
    cameras:
      camera_id: text
      name: text
      site: text
      timezone: text
      created_at: timestamptz
    zones:
      zone_id: text
      camera_id: text
      name: text
      polygon: jsonb
    frames:
      frame_id: text
      camera_id: text
      ts: timestamptz
      object_key: text
      width: int
      height: int
      brightness: double precision
      blur_var: double precision
      model_version: text
    detections:
      ts: timestamptz
      camera_id: text
      frame_id: text
      track_id: text
      class_name: text
      confidence: double precision
      x1: double precision
      y1: double precision
      x2: double precision
      y2: double precision
      model_version: text
    tracks:
      track_id: text
      camera_id: text
      class_name: text
      first_seen: timestamptz
      last_seen: timestamptz
      n_frames: int
    events:
      event_id: text
      ts: timestamptz
      camera_id: text
      track_id: text
      zone_id: text
      event_type: text

  # Matched against every name a function is known by (as written, sqlglot's canonical name
  # and the dialect rendering). Prefixes cover whole families (pg_sleep, pg_read_file,
  # pg_terminate_backend, lo_import, dblink_exec, txid_current, ...).
  denied_function_prefixes: [pg_, lo_, dblink, txid_]
  denied_functions:
    # settings, server and session state
    - current_setting
    - set_config
    - version
    - inet_server_addr
    - inet_server_port
    - inet_client_addr
    # side effects on sequences
    - nextval
    - setval
    - currval
    - lastval
    # run arbitrary SQL or dump tables as XML
    - query_to_xml
    - query_to_xml_and_xmlschema
    - table_to_xml
    - schema_to_xml
    - database_to_xml
    - cursor_to_xml
    # resource exhaustion
    - generate_series
    - repeat
    - lpad
    - rpad

# Versioned data files (paths from the repo root).
assets:
  fewshots: eval/fewshot/structured.v1.jsonl
  planner_prompt: configs/prompts/planner.v1.txt
  sql_prompt: configs/prompts/sql.v1.txt

# LLM planner. Which model: LLM_BASE_URL, LLM_MODEL, LLM_API_KEY in .env (vms.query.llm).
llm:
  provider: auto              # auto: openai when LLM_MODEL is set, else canned | openai | canned
  response_format: json_schema  # json_schema (Ollama, vLLM, OpenAI) | json_object (DeepSeek) | none
  temperature: 0.0
  max_tokens: 1024
  timeout_s: 30
  max_retries: 2              # on connection errors, timeouts, 429 and 5xx; full-jitter backoff
  retry_base_s: 0.5
  retry_max_s: 4.0
  canned_plans:               # question -> plan for the canned client (demo, CI)
    - configs/demo/canned_plans.v1.jsonl

planner:
  repair_attempts: 1          # re-asks after a plan fails validation, with the errors
  max_time_range_days: 400
  max_future_start_hours: 24

# Object classes YOLO11 (COCO) can emit; plans may only filter on these names.
classes: [person, bicycle, car, motorcycle, airplane, bus, train, truck, boat, traffic light,
  fire hydrant, stop sign, parking meter, bench, bird, cat, dog, horse, sheep, cow, elephant,
  bear, zebra, giraffe, backpack, umbrella, handbag, tie, suitcase, frisbee, skis, snowboard,
  sports ball, kite, baseball bat, baseball glove, skateboard, surfboard, tennis racket, bottle,
  wine glass, cup, fork, knife, spoon, bowl, banana, apple, sandwich, orange, broccoli, carrot,
  hot dog, pizza, donut, cake, chair, couch, potted plant, bed, dining table, toilet, tv, laptop,
  mouse, remote, keyboard, cell phone, microwave, oven, toaster, sink, refrigerator, book, clock,
  vase, scissors, teddy bear, hair drier, toothbrush]
