name: ramp-cpu-ort-b4-ext
description: >
  Task 5.5, ramp-cpu-ort-b4 continued past its top step: ramp-cpu-ort-b4 passed all of 1 to 5
  cameras (rated capacity only a lower bound), so this finds the knee. Same stack, worker and
  settings (yolo11n, ONNX Runtime FP32, infer_batch 4, data-mini at 5 FPS per camera, 1280x720
  q85), steps of 5 to 8 cameras (5 repeated as the link to the first run), warmup 20 s, hold
  90 s, 3 repetitions, no query load. Start the worker with WORKER_BACKEND=onnxruntime
  WORKER_INFER_BATCH=4. Quiet host: nothing else CPU-heavy.
kind: e2e
repeats: 3
warmup_s: 20
hold_s: 90
expect_worker:
  backend: onnxruntime
  precision: fp32
  infer_batch: "4"
ingest:
  cameras: [5, 6, 7, 8]
  fps: 5
